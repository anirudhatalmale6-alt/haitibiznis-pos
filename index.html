<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sant HaitiBiznis — POS</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<meta name="theme-color" content="#00209F">
<style>
:root{--blue:#00209F;--red:#D21034;--ink:#12151c;--muted:#6b7280;--bg:#eef1f6;--card:#fff;--line:#e2e6ee;
  --good:#12a150;--warn:#e08a00;--shadow:0 2px 10px rgba(20,30,60,.08);--shadow-lg:0 10px 30px rgba(20,30,60,.14);--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;padding-bottom:150px;max-width:720px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer}img{display:block}
.appbar{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--blue),#0b2fc4);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.appbar .logo{width:38px;height:38px;border-radius:10px;background:#fff;padding:3px;object-fit:contain}
.appbar h1{font-size:16px;margin:0;line-height:1.15;font-weight:800;flex:1}
.appbar h1 small{display:block;font-weight:500;opacity:.85;font-size:11px;letter-spacing:.4px}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.15);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;opacity:.7}
.lang button.on{background:#fff;color:var(--blue);opacity:1}
.gear{border:0;background:rgba(255,255,255,.16);color:#fff;width:34px;height:34px;border-radius:10px;font-size:17px}
main{padding:16px 14px}
.screen{display:none;animation:fade .2s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h2{font-size:20px;font-weight:800;margin:2px 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;color:var(--blue);font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;box-shadow:var(--shadow);margin-bottom:14px}
/* module grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px 10px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:9px;min-height:120px;justify-content:center;transition:transform .12s}
.mod:active{transform:scale(.96)}
.mod .em{font-size:34px;line-height:1}
.mod .il{width:52px;height:52px;border-radius:12px;background:#fff;padding:5px;object-fit:contain;border:1px solid var(--line);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.mod .nm{font-weight:800;font-size:13px;line-height:1.2}
/* sub buttons */
.subs{display:flex;flex-direction:column;gap:10px}
.subbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);font-weight:800;font-size:15px;text-align:left}
.subbtn .se{font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
label.fl{display:block;font-weight:700;font-size:13px;margin:0 0 6px}
input[type=text],input[type=tel],input[type=number],input[type=email],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 12px;font-size:16px;background:#fbfcfe;color:var(--ink);margin-bottom:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff}
textarea{min-height:58px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin:-8px 0 14px}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps .st{flex:1;height:6px;border-radius:999px;background:var(--line)}.steps .st.on{background:var(--blue)}.steps .st.done{background:var(--good)}
/* customer search */
.crow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fbfcfe}
.crow.on{border-color:var(--blue);background:#eef3ff}
.crow .ci{width:40px;height:40px;border-radius:50%;background:#e7ecfa;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--blue);flex:0 0 auto}
.crow .ct{flex:1}.crow .ct .nm{font-weight:800}.crow .ct .ds{font-size:12px;color:var(--muted)}
/* choice */
.choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;background:#fbfcfe;font-weight:600}
.choice.on{border-color:var(--blue);background:#eef3ff}
.choice .dot{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:0 0 auto;position:relative}
.choice.radio .dot{border-radius:50%}.choice.on .dot:after{content:"";position:absolute;inset:4px;border-radius:2px;background:var(--blue)}
.choice.radio.on .dot:after{border-radius:50%}.choice.on .dot{border-color:var(--blue)}
.choice .txt{flex:1}.choice .amt{font-weight:800;color:var(--blue);white-space:nowrap}
.choice .price-in{width:96px;margin:0;padding:8px;text-align:right}
.pill{display:inline-block;font-size:11px;background:#eef3ff;color:var(--blue);border-radius:999px;padding:2px 8px;font-weight:700}
.banner{background:#eef3ff;border:1px solid #cdd9ff;border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-weight:700;color:var(--blue);display:flex;justify-content:space-between;align-items:center}
.banner b{font-size:17px}
.breakdown div{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:var(--muted)}
.breakdown div.tot{color:var(--ink);font-weight:800;font-size:16px;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.totbar{display:flex;justify-content:space-between;align-items:center;background:#0e1830;color:#fff;border-radius:14px;padding:14px 16px;margin:6px 0 14px}
.totbar b{font-size:20px}.totbar span{opacity:.8;font-size:13px}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay{border:1.5px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center;background:#fbfcfe;font-weight:800;font-size:14px}
.pay .pe{font-size:26px;display:block;margin-bottom:5px}.pay.on{border-color:var(--blue);background:#eef3ff}
.dropz{display:block;width:100%;border:2px dashed var(--blue);border-radius:14px;padding:16px;text-align:center;background:#f4f7ff;color:var(--blue);font-weight:700;margin-bottom:10px;font-size:13px}
.dropz .de{font-size:28px;margin-bottom:2px}
.filerow{display:flex;align-items:center;gap:10px;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.filerow .fi{width:32px;height:32px;border-radius:8px;object-fit:cover;background:#eef1f6;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.filerow .fx{margin-left:auto;color:var(--red);border:0;background:none;font-size:18px;font-weight:800}
.upgroup{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 6px}
.cta{width:100%;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:17px;padding:16px;border-radius:14px;box-shadow:var(--shadow-lg);margin-top:4px}
.cta:active{transform:scale(.99)}.cta.red{background:var(--red)}.cta.green{background:var(--good)}.cta.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line);box-shadow:var(--shadow)}.cta:disabled{opacity:.45}
.row2 .cta{margin-top:0}
/* orders */
.searchbox{margin-bottom:12px}
.filterbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.filterbar button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:12px;color:var(--muted)}
.filterbar button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.order .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.order .who{font-weight:800;font-size:15px}.order .meta{font-size:12px;color:var(--muted)}
.order .svc-t{font-size:13px;font-weight:700;color:var(--blue);margin:6px 0}
.badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.order .amt2{font-weight:800;font-size:15px}
.statusrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.statusrow button{flex:1;min-width:60px;border:1.5px solid var(--line);background:#fbfcfe;border-radius:10px;padding:7px 4px;font-size:10px;font-weight:700;color:var(--muted)}
.statusrow button.on{border-color:var(--blue);background:#eef3ff;color:var(--blue)}
.rtag{display:inline-block;font-size:10px;font-weight:800;background:#eef3ff;color:var(--blue);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.mini{font-size:12px;color:var(--blue);font-weight:700;border:0;background:none;padding:6px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:900;line-height:1}.stat .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}
.stat.sales{grid-column:1/-1;background:linear-gradient(120deg,var(--blue),#0b2fc4);color:#fff;border:0}.stat.sales .l{color:#fff;opacity:.85}
.stat.rev{grid-column:1/-1;background:#0e1830;color:#fff;border:0}.stat.rev .l{color:#fff;opacity:.8}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-weight:600}.empty .ee{font-size:44px;margin-bottom:10px}
.confirm{text-align:center;padding:6px}
.confirm .ok{width:76px;height:76px;border-radius:50%;background:var(--good);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:6px auto 12px}
.qrbox{text-align:center;margin:10px 0}.qrbox img{width:190px;height:190px;margin:0 auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.qrcode-txt{font-family:monospace;font-weight:800;font-size:16px;background:#eef1f6;border-radius:8px;padding:6px 12px;display:inline-block;margin-top:8px}
.receipt{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.receipt .rh{text-align:center;border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:12px}
.receipt .rh img{width:50px;height:50px;object-fit:contain;margin:0 auto 6px;border-radius:10px}
.receipt .rh .bt{font-weight:900;font-size:18px;color:var(--blue)}.receipt .rh .st{font-size:12px;color:var(--muted)}
.receipt .rrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.receipt .ritem{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dotted var(--line)}
.receipt .rtot{display:flex;justify-content:space-between;font-weight:900;font-size:17px;border-top:2px dashed var(--line);margin-top:10px;padding-top:10px}
.receipt .rf{text-align:center;font-size:11px;color:var(--muted);margin-top:14px}
.settings-note{font-size:12px;color:var(--warn);background:#fff8ec;border:1px solid #ffe6b0;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-weight:600}
.partner{font-size:12px;color:var(--muted);background:#f4f7ff;border:1px solid #dce4f7;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-weight:600}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -4px 16px rgba(20,30,60,.06);z-index:30}
.nav button{flex:1;border:0;background:none;padding:9px 0 10px;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ni{font-size:22px;line-height:1}.nav button.on{color:var(--blue)}
.badge-dot{position:relative}
.badge-dot[data-n]:not([data-n="0"]):after{content:attr(data-n);position:absolute;top:-3px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media print{.appbar,.nav,.back,.cta,.no-print{display:none!important}body{padding:0}}
</style>
</head>
<body>

<div class="appbar">
  <img src="assets/haitibiznis-logo.png" class="logo" alt="HaitiBiznis">
  <h1 data-i18n="app_t">Sant HaitiBiznis<small data-i18n="app_s">POINT OF SALE</small></h1>
  <div class="lang"><button data-lang="ht" class="on">HT</button><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
  <button class="gear" onclick="go('set')">⚙️</button>
</div>

<main>
<section id="s-home" class="screen on">
  <div class="h2" data-i18n="home_t">Chwazi yon sèvis</div>
  <p class="sub" data-i18n="home_s">Kès la: enskri kliyan, vann sèvis, resevwa peman.</p>
  <div class="grid" id="modGrid"></div>
</section>

<section id="s-subs" class="screen">
  <button class="back" onclick="go('home')">‹ <span data-i18n="back">Retounen</span></button>
  <div class="h2" id="subTitle"></div>
  <div class="subs" id="subList"></div>
</section>

<!-- generic flow (customer -> detail -> docs -> payment) -->
<section id="s-flow" class="screen">
  <button class="back" onclick="flowBack()">‹ <span data-i18n="back">Retounen</span></button>
  <div class="steps"><div class="st" data-fstep="1"></div><div class="st" data-fstep="2"></div><div class="st" data-fstep="3"></div><div class="st" data-fstep="4"></div></div>

  <div id="fstep-cust" class="fbox">
    <div class="h2" data-i18n="cust_t">Kliyan</div>
    <p class="sub" id="flowSvcLabel"></p>
    <div class="card">
      <input type="text" id="custSearch" data-i18n-ph="cust_search" placeholder="Chèche pa non / telefòn...">
      <div id="custResults"></div>
    </div>
    <button class="cta ghost" onclick="showNewCust()" data-i18n="cust_new">+ Nouvo kliyan</button>
    <div class="card" id="newCustCard" style="display:none;margin-top:14px">
      <label class="fl" data-i18n="f_name">Non konplè</label><input type="text" id="c_name">
      <div class="row2"><div><label class="fl" data-i18n="f_phone">Telefòn</label><input type="tel" id="c_phone" inputmode="tel"></div>
      <div><label class="fl" data-i18n="f_wa">WhatsApp</label><input type="tel" id="c_wa" inputmode="tel"></div></div>
      <label class="fl" data-i18n="f_email">Imel (opsyonèl)</label><input type="email" id="c_email">
      <label class="fl" data-i18n="f_addr">Adrès (opsyonèl)</label><input type="text" id="c_addr">
      <button class="cta" onclick="saveNewCust()" data-i18n="cust_save">Kontinye</button>
    </div>
  </div>

  <div id="fstep-detail" class="fbox" style="display:none">
    <div class="h2" id="detailTitle"></div>
    <p class="sub" id="detailCust"></p>
    <div id="detailBody"></div>
    <div class="totbar"><span data-i18n="subtotal">Total</span><b id="detailTot">0 GDES</b></div>
    <button class="cta" onclick="flowStep(3)" data-i18n="next">Kontinye</button>
  </div>

  <div id="fstep-docs" class="fbox" style="display:none">
    <div class="h2" data-i18n="docs_t">Dokiman</div>
    <p class="sub" data-i18n="docs_s">Ajoute fichye (PDF, JPG, PNG, DOCX). Y ap tache ak kòmand lan.</p>
    <label class="dropz" for="docInput"><span class="de">📎</span><span data-i18n="docs_add">Ajoute Dokiman</span></label>
    <input type="file" id="docInput" accept=".pdf,.jpg,.jpeg,.png,.docx,image/*" multiple capture="environment" style="display:none">
    <div id="fileList"></div>
    <button class="cta" onclick="flowStep(4)" data-i18n="next">Kontinye</button>
  </div>

  <div id="fstep-pay" class="fbox" style="display:none">
    <div class="h2" data-i18n="pay_t">Peman</div>
    <div class="card"><div class="breakdown" id="payBreak"></div></div>
    <div class="pays" id="payGrid">
      <button class="pay" data-pay="cash"><span class="pe">💵</span><span data-i18n="p_cash">Kach</span></button>
      <button class="pay" data-pay="moncash"><span class="pe">📱</span>MonCash</button>
      <button class="pay" data-pay="natcash"><span class="pe">📲</span>NatCash</button>
      <button class="pay" data-pay="card"><span class="pe">💳</span><span data-i18n="p_card">Kat</span></button>
    </div>
    <div style="height:12px"></div>
    <button class="cta red" id="payBtn" onclick="completeFlow()" disabled data-i18n="pay_do">Konplete & Resi</button>
  </div>
</section>

<!-- registration flow (person-first, data-driven) -->
<section id="s-reg" class="screen">
  <button class="back" onclick="go('home')">‹ <span data-i18n="back">Retounen</span></button>
  <div class="h2" id="regTitle"></div>
  <p class="sub" id="regSub"></p>
  <div id="regBody"></div>
</section>

<!-- receipt / confirmation -->
<section id="s-done" class="screen">
  <div class="confirm no-print"><div class="ok">✓</div></div>
  <div id="doneExtra"></div>
  <div class="receipt" id="receiptBox"></div>
  <div style="height:14px"></div>
  <div class="row2 no-print">
    <button class="cta ghost" onclick="window.print()" data-i18n="print">Enprime</button>
    <button class="cta green" id="waBtn" data-i18n="wa_send">WhatsApp</button>
  </div>
  <div style="height:10px"></div>
  <button class="cta no-print" onclick="go('home')" data-i18n="conf_home">Akèy</button>
</section>

<!-- tickets: event create / checkin -->
<section id="s-tickets" class="screen">
  <button class="back" onclick="go('home')">‹ <span data-i18n="back">Retounen</span></button>
  <div id="ticketsBody"></div>
</section>

<section id="s-orders" class="screen">
  <div class="h2" data-i18n="ord_t">Kòmand yo</div>
  <input type="text" id="ordSearch" class="searchbox" data-i18n-ph="ord_search" placeholder="Chèche non / tel / WhatsApp / Nº kòmand">
  <div class="filterbar" id="filterBar"></div>
  <div id="ordersList"></div>
</section>

<section id="s-dash" class="screen">
  <div class="h2" data-i18n="dash_t">Tablodbò</div>
  <p class="sub" id="dashDate"></p>
  <div class="stats" id="dashStats"></div>
</section>

<section id="s-set" class="screen">
  <button class="back" onclick="go('home')">‹ <span data-i18n="back">Retounen</span></button>
  <div class="h2" data-i18n="set_t">Paramèt</div>
  <div class="settings-note" data-i18n="set_note">Antre vrè pri yo. Chanjman yo sere sou aparèy sa a.</div>
  <div class="card" id="setBody"></div>
  <button class="cta" onclick="saveSettings()" data-i18n="set_save">Sere paramèt</button>
</section>
</main>

<nav class="nav">
  <button data-nav="home" class="on" onclick="go('home')"><span class="ni">🏠</span><span data-i18n="n_home">Akèy</span></button>
  <button data-nav="orders" class="badge-dot" onclick="go('orders')"><span class="ni">📋</span><span data-i18n="n_orders">Kòmand</span></button>
  <button data-nav="dash" onclick="go('dash')"><span class="ni">📊</span><span data-i18n="n_dash">Tablodbò</span></button>
  <button data-nav="set" onclick="go('set')"><span class="ni">⚙️</span><span data-i18n="n_set">Paramèt</span></button>
</nav>

<script src="qrcode.js"></script>
<script>
/* ============================================================
   Sant HaitiBiznis — Unified POS (MVP v3)
   10 modules, customer CRM, docs, payments, receipt(+WhatsApp),
   orders, search, dashboard. Single file + qrcode.js. HT/FR/EN.
   ============================================================ */
const T={
 ht:{app_t:'Sant HaitiBiznis',app_s:'POINT OF SALE',home_t:'Chwazi yon sèvis',home_s:'Kès la: enskri kliyan, vann sèvis, resevwa peman.',
  back:'Retounen',next:'Kontinye',subtotal:'Total',cust_t:'Kliyan',cust_search:'Chèche pa non / telefòn...',cust_new:'+ Nouvo kliyan',
  f_name:'Non konplè',f_phone:'Telefòn',f_wa:'WhatsApp',f_email:'Imel (opsyonèl)',f_addr:'Adrès (opsyonèl)',cust_save:'Kontinye',
  docs_t:'Dokiman',docs_s:'Ajoute fichye (PDF, JPG, PNG, DOCX). Y ap tache ak kòmand lan.',docs_add:'Ajoute Dokiman',

/* ---------- navigation ---------- */
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+name).classList.add('on');
  const nm={home:'home',orders:'orders',dash:'dash',set:'set'};
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===nm[name]));
  if(!nm[name])document.querySelector('.nav button[data-nav="home"]').classList.add('on');
  window.scrollTo(0,0);
  if(name==='orders')renderOrders();if(name==='dash')renderDash();if(name==='set')renderSettings();
  refreshBadges();
}
function refreshBadges(){const o=load('hb_orders',[]);

function openModule(m){
  if(m.type==='order'){startFlow(m.id);}
  else if(m.type==='reg'){startReg(m.reg);}
  else if(m.type==='tickets'){openTickets();}
  else if(m.type==='sub'){openSubs(m);}

function openSubs(m){
  const subs={
    msouwout:[['driver','🏍️','Enskri Chofè'],['rider','🙋','Enskri Pasaje'],['verify','✅',t('verify_t')]],
    myplopplop:[['merchant','🏪','Enskri Machann'],['delivery','🚚','Demann Livrezon']]
  }[m.id];
  document.getElementById('subTitle').textContent=m.nm;
  const list=document.getElementById('subList');list.innerHTML='';
  subs.forEach(([id,em,label])=>{const b=document.createElement('button');b.className='subbtn';
    b.innerHTML=`<span class="se">${em}</span>${label}`;

      if(m.id==='msouwout'&&id==='verify'){openVerify();}

}

function customers(){return load('hb_customers',[]);}
function findCust(q){q=q.toLowerCase();return customers().filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.wa||'').includes(q));}

/* ===================================================================
   GENERIC FLOW: customer -> detail -> docs -> payment -> receipt
   =================================================================== */
let flow=null;   // {module, customer, items[], amount, docs[], payment, extra}
let fstep=1;
function startFlow(moduleId,preItems){
  flow={module:moduleId,customer:null,items:preItems||[],amount:0,docs:[],payment:null,extra:{}};
  if(moduleId==='48h'){flow.extra.pkg=null;flow.extra.sel=[];}
  if(moduleId==='bizreg'){flow.extra.reg=null;}
  document.getElementById('flowSvcLabel').textContent=modById(moduleId)?modById(moduleId).nm:moduleId;
  go('flow');fstep=1;showFlowStep();renderCustSearch();
}
function flowBack(){ if(fstep===1)go('home'); else {fstep--;showFlowStep();} }
function setFlowSteps(){document.querySelectorAll('.steps .st').forEach(el=>{const n=+el.dataset.fstep;el.classList.toggle('on',n===fstep);el.classList.toggle('done',n<fstep);});}
function showFlowStep(){setFlowSteps();
  ['cust','detail','docs','pay'].forEach((x,i)=>document.getElementById('fstep-'+x).style.display=(i+1===fstep)?'block':'none');
  if(fstep===2)renderDetail();if(fstep===4)renderPay();window.scrollTo(0,0);}
function flowStep(n){
  if(n===3){computeAmount();if(!flow.items.length){alert(t('need_sel'));return;}}
  fstep=n;showFlowStep();
}
function renderCustSearch(){
  document.getElementById('newCustCard').style.display='none';
  const inp=document.getElementById('custSearch');inp.value='';
  const res=document.getElementById('custResults');
  function draw(){const q=inp.value.trim();res.innerHTML='';const list=q?findCust(q):customers().slice(-5).reverse();
    list.forEach(c=>{const el=document.createElement('div');el.className='crow';
      el.innerHTML=`<div class="ci">${(c.name||'?')[0].toUpperCase()}</div><div class="ct"><div class="nm">${c.name}</div><div class="ds">${c.phone||''} ${c.wa?('· '+c.wa):''}</div></div>`;
      el.onclick=()=>{flow.customer=c;fstep=2;showFlowStep();};res.appendChild(el);});
    if(q&&!list.length)res.innerHTML=`<div class="hint">—</div>`;}
  inp.oninput=draw;draw();
}
function showNewCust(){document.getElementById('newCustCard').style.display='block';document.getElementById('c_name').focus();}
function saveNewCust(){const name=document.getElementById('c_name').value.trim();if(!name){alert(t('need_name'));return;}
  const c={id:'C-'+(customers().length+1),name,phone:document.getElementById('c_phone').value.trim(),wa:document.getElementById('c_wa').value.trim(),
    email:document.getElementById('c_email').value.trim(),addr:document.getElementById('c_addr').value.trim(),ts:nowStamp()};
  const list=customers();list.push(c);save('hb_customers',list);
  ['c_name','c_phone','c_wa','c_email','c_addr'].forEach(i=>document.getElementById(i).value='');
  flow.customer=c;fstep=2;showFlowStep();}

/* ----- detail per module ----- */
function renderDetail(){
  const m=flow.module;document.getElementById('detailTitle').textContent=modById(m).nm;
  document.getElementById('detailCust').textContent=flow.customer?flow.customer.name:'';
  const body=document.getElementById('detailBody');body.innerHTML='';const cfg=getCfg();

  if(m==='48h'){
    body.innerHTML=`<p class="sub">${t('pick_pkg')}</p>`;
    FH_PACKAGES.forEach((p,i)=>{const on=flow.extra.pkg===i;const row=document.createElement('div');row.className='choice radio'+(on?' on':'');
      row.innerHTML=`<span class="dot"></span><span class="txt">${p.amt.toLocaleString()} GDES <span class="pill">${t('pkg_max')} ${p.max} ${t('services')}</span></span>`;
      row.onclick=()=>{flow.extra.pkg=i;flow.extra.sel=flow.extra.sel.slice(0,p.max);renderDetail();};body.appendChild(row);});
    if(flow.extra.pkg!==null){const max=FH_PACKAGES[flow.extra.pkg].max;
      body.innerHTML+=`<p class="sub" style="margin-top:10px">${t('pkg_max')} ${max} ${t('services')} — ${flow.extra.sel.length}/${max}</p>`;
      const wrap=document.createElement('div');
      FH_SERVICES.forEach(s=>{const on=flow.extra.sel.includes(s);const row=document.createElement('div');row.className='choice'+(on?' on':'');
        row.innerHTML=`<span class="dot"></span><span class="txt">${s}</span>`;
        row.onclick=()=>{const idx=flow.extra.sel.indexOf(s);if(idx>=0)flow.extra.sel.splice(idx,1);else{if(flow.extra.sel.length>=max)return;flow.extra.sel.push(s);}renderDetail();};
        wrap.appendChild(row);});body.appendChild(wrap);}
  }
  else if(m==='admin'||m==='legal'){
    if(m==='legal')body.innerHTML=`<div class="partner">${t('partner_legal')}</div>`;
    body.innerHTML+=`<p class="sub">${t('amount')}: antre pri, peze +</p>`;
    (m==='admin'?ADMIN_ITEMS:LEGAL_ITEMS).forEach((name,i)=>{const ex=flow.items.find(it=>it.label===name);
      const row=document.createElement('div');row.className='choice check'+(ex?' on':'');
      row.innerHTML=`<span class="dot"></span><span class="txt">${name}</span><input type="number" class="price-in" inputmode="numeric" placeholder="GDES" value="${ex?ex.amt:''}">`;
      const inp=row.querySelector('input');
      row.onclick=(e)=>{if(e.target===inp)return;const idx=flow.items.findIndex(it=>it.label===name);if(idx>=0)flow.items.splice(idx,1);else flow.items.push({label:name,amt:+inp.value||0});renderDetail();};
      inp.oninput=()=>{let it=flow.items.find(x=>x.label===name);if(!it){it={label:name,amt:0};flow.items.push(it);row.classList.add('on');}it.amt=+inp.value||0;computeAmount();document.getElementById('detailTot').textContent=gdes(flow.amount);};
      body.appendChild(row);});
  }
  else if(m==='bizreg'){
    body.innerHTML=`<p class="sub">Baz an US$, frè Près an GDES. To: ${cfg.rate} GDES/US$</p>`;
    cfg.bizreg.forEach(r=>{const on=flow.extra.reg===r.id;const row=document.createElement('div');row.className='choice radio'+(on?' on':'');
      row.innerHTML=`<span class="dot"></span><span class="txt">${r.nm}<div style="font-size:11px;color:var(--muted);font-weight:600">US$${r.usd.toLocaleString()}${r.press?' + '+r.press.toLocaleString()+' GDES Près':''}</div></span>`;
      row.onclick=()=>{flow.extra.reg=r.id;renderDetail();};body.appendChild(row);});
    if(flow.extra.reg){const r=cfg.bizreg.find(x=>x.id===flow.extra.reg);const tot=r.usd*(1+cfg.hbFeePct/100)*cfg.rate+r.press;
      const bd=document.createElement('div');bd.className='card';bd.innerHTML=`<div class="breakdown">
        <div><span>${t('base')}</span><span>US$${r.usd.toLocaleString()}</span></div>
        ${r.press?`<div><span>${t('fee_press')}</span><span>${r.press.toLocaleString()} GDES</span></div>`:''}
        <div class="tot"><span>${t('total')}</span><span>${gdes(tot)}</span></div></div>`;
      body.appendChild(bd);}
  }
  else if(m==='paymenthub'){
    body.innerHTML=`<label class="fl">${t('bill_type')}</label><select id="billType">${BILL_TYPES.map(b=>`<option>${b}</option>`).join('')}</select>
      <label class="fl">${t('desc')}</label><input type="text" id="billRef" placeholder="Nº kont / referans">
      <label class="fl">${t('amount')}</label><input type="number" id="billAmt" inputmode="numeric">`;
    const upd=()=>{const a=+document.getElementById('billAmt').value||0;const ty=document.getElementById('billType').value;const rf=document.getElementById('billRef').value.trim();
      flow.items=a>0?[{label:ty+(rf?(' — '+rf):''),amt:a}]:[];computeAmount();document.getElementById('detailTot').textContent=gdes(flow.amount);};
    body.querySelector('#billAmt').oninput=upd;body.querySelector('#billType').onchange=upd;body.querySelector('#billRef').oninput=upd;
  }
  computeAmount();document.getElementById('detailTot').textContent=gdes(flow.amount);
}
function computeAmount(){const m=flow.module;const cfg=getCfg();
  if(m==='48h'){if(flow.extra.pkg!==null){const p=FH_PACKAGES[flow.extra.pkg];flow.items=[{label:'48HoursReady — '+(flow.extra.sel.join(', ')||p.max+' '+t('services')),amt:p.amt}];flow.amount=p.amt;}else{flow.items=[];flow.amount=0;}}
  else if(m==='bizreg'){if(flow.extra.reg){const r=cfg.bizreg.find(x=>x.id===flow.extra.reg);const tot=r.usd*(1+cfg.hbFeePct/100)*cfg.rate+r.press;flow.items=[{label:r.nm+' (US$'+r.usd.toLocaleString()+(r.press?' + '+r.press.toLocaleString()+' GDES Près':'')+')',amt:tot}];flow.amount=tot;}else{flow.items=[];flow.amount=0;}}
  else {flow.amount=flow.items.reduce((a,b)=>a+(+b.amt||0),0);}
}

let reg=null;
function startReg(kind){const sc=REG_FORMS[kind];reg={kind,docs:{},fee:0,vehType:'moto'};
  document.getElementById('regTitle').textContent=sc.title;document.getElementById('regSub').textContent='';
  const body=document.getElementById('regBody');body.innerHTML='';
  if(kind==='affiliate'){const cl=document.createElement('button');cl.className='cta ghost';cl.style.marginBottom='12px';cl.textContent=t('aff_comm')+' →';cl.onclick=openCommission;body.appendChild(cl);}
  const card=document.createElement('div');card.className='card';
  sc.fields.forEach(f=>{const[key,lbl,type,opts]=f;
    if(type==='sel'){card.innerHTML+=`<label class="fl">${t(lbl)}</label><select id="rf_${key}">${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;}
    else if(key==='vehicle'){card.innerHTML+=`<label class="fl">${t('vehicle')}</label><div class="row2" style="margin-bottom:14px"><button class="cta ghost" id="veh_moto" style="margin:0">🏍️ Moto</button><button class="cta ghost" id="veh_car" style="margin:0">🚗 Machin</button></div>`;}
    else{card.innerHTML+=`<label class="fl">${t(lbl)}</label><input type="${key==='email'?'email':(key==='phone'||key==='wa'?'tel':'text')}" id="rf_${key}">`;}
  });
  const feeKey=sc.feeKey;if(feeKey){card.innerHTML+=`<label class="fl">${t('set_regfee_'+(kind==='driver'?'d':kind==='rider'?'r':kind==='merchant'?'m':'p'))||'Frè (GDES)'}</label><input type="number" id="rf_fee" inputmode="numeric" value="${getCfg()[feeKey]||0}">`;}
  body.appendChild(card);
  sc.uploads.forEach(u=>{const wrap=document.createElement('div');wrap.innerHTML=`<div class="upgroup">${u}</div>`;
    const lab=document.createElement('label');lab.className='dropz';lab.style.padding='12px';lab.innerHTML=`📎 ${u}`;
    const inp=document.createElement('input');inp.type='file';inp.accept='.pdf,.jpg,.jpeg,.png,.docx,image/*';inp.style.display='none';
    lab.appendChild(inp);inp.onchange=e=>{reg.docs[u]=[...e.target.files].map(f=>f.name);const badge=wrap.querySelector('.upgroup');badge.textContent=u+' ✓ ('+e.target.files.length+')';};
    wrap.appendChild(lab);body.appendChild(wrap);});
  const btn=document.createElement('button');btn.className='cta';btn.textContent=sc.feeKey?t('pay_do'):t('save');btn.onclick=()=>saveReg(kind);body.appendChild(btn);
  go('reg');
  if(sc.fields.some(f=>f[0]==='vehicle')){document.getElementById('veh_moto').classList.remove('ghost');
    document.getElementById('veh_moto').onclick=()=>{reg.vehType='moto';document.getElementById('veh_moto').classList.remove('ghost');document.getElementById('veh_car').classList.add('ghost');};
    document.getElementById('veh_car').onclick=()=>{reg.vehType='car';document.getElementById('veh_car').classList.remove('ghost');document.getElementById('veh_moto').classList.add('ghost');};}
}
function saveReg(kind){const sc=REG_FORMS[kind];const name=document.getElementById('rf_name').value.trim();if(!name){alert(t('need_name'));return;}
  const data={};sc.fields.forEach(f=>{const key=f[0];if(key==='vehicle'){data.vehicle=reg.vehType==='moto'?'Moto':'Machin';}else{const el=document.getElementById('rf_'+key);if(el)data[key]=el.value.trim();}});
  const fee=sc.feeKey?(+document.getElementById('rf_fee').value||0):0;
  const docsFlat=[];Object.keys(reg.docs).forEach(k=>reg.docs[k].forEach(n=>docsFlat.push({name:k+': '+n})));
  const orders=load('hb_orders',[]);const id=sc.prefix+'-'+String(1000+orders.length+1);
  const metaBits=[];sc.fields.forEach(f=>{const key=f[0];if(['vehicle','plate','color','profession','category','biz','owner','addr'].includes(key)&&data[key])metaBits.push(data[key]);});
  const rec={id,type:'reg',regKind:kind,statusSet:sc.statusSet||'merch',module:kind,svcName:sc.title,
    name,phone:data.phone||'',wa:data.wa||'',email:data.email||'',
    items:metaBits.map(m=>({label:m,amt:0})),amount:fee,payment:fee>0?'cash':null,
    docs:docsFlat,status:(sc.statusSet?STATUS[sc.statusSet][0].id:'pending'),ts:nowStamp()};
  /* affiliate referral code */
  if(sc.referral){rec.refCode='HB-'+name.replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase()+String(1000+orders.length+1);}
  orders.push(rec);save('hb_orders',orders);
  /* also add as customer for future lookup */
  const custs=customers();if(!custs.find(c=>c.phone&&c.phone===rec.phone&&rec.phone)){custs.push({id:'C-'+(custs.length+1),name,phone:rec.phone,wa:rec.wa,email:rec.email,addr:'',ts:nowStamp()});save('hb_customers',custs);}
  if(sc.referral){showReferral(rec);}else{showReceipt(rec);}
  refreshBadges();
}

      el.innerHTML=`<div class="top"><div class="who">${tk.name}</div><span class="badge" style="background:${done?'#e6f7ee':'#fff6e6'};color:${done?'#0c8f45':'#b57000'}">${done?t('checkin_ok'):tk.checkedIn+'/'+tk.qty}</span></div>
        <div class="meta">${tk.id} · ${tk.svcName}</div>${done?'':`<button class="mini">✓ ${t('ev_checkin')}</button>`}`;
      const btn=el.querySelector('.mini');if(btn)btn.onclick=()=>{const os=load('hb_orders',[]);const r=os.find(x=>x.id===tk.id);r.checkedIn=(r.checkedIn||0)+1;save('hb_orders',os);draw();};
      res.appendChild(el);});
    if(!tks.length)res.innerHTML=`<div class="empty"><div class="ee">🎟️</div>—</div>`;};
  document.getElementById('ci_search').oninput=draw;draw();
}
function ticketSales(){const body=document.getElementById('ticketsBody');const tks=load('hb_orders',[]).filter(o=>o.type==='ticket');
  const total=tks.reduce((a,b)=>a+b.amount,0);const qty=tks.reduce((a,b)=>a+b.qty,0);
  body.innerHTML=`<button class="back" onclick="renderTicketsHome()">‹ ${t('back')}</button><div class="h2">${t('ev_sales')}</div>
    <div class="stats" style="margin-bottom:14px"><div class="stat sales"><div class="n">${gdes(total)}</div><div class="l">${t('ev_sales')}</div></div>
    <div class="stat"><div class="n">${qty}</div><div class="l">🎟️ Tikè</div></div><div class="stat"><div class="n">${tks.reduce((a,b)=>a+(b.checkedIn||0),0)}</div><div class="l">✓ ${t('st_checkin')}</div></div></div>
    ${tks.slice().reverse().map(tk=>`<div class="order"><div class="top"><div><div class="who">${tk.name}</div><div class="meta">${tk.id} · ${tk.svcName}</div></div><div class="amt2">${gdes(tk.amount)}</div></div></div>`).join('')||`<div class="empty">${t('need_sel')}</div>`}`;
}

/* ===================================================================
   RECEIPT / QR
   =================================================================== */
function qrDataURL(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(5,8);}catch(e){return null;}}
function showReceipt(o){const cust=o.name;const items=(o.items||[]).map(it=>`<div class="ritem"><span>${it.label}</span><span>${it.amt?gdes(it.amt):''}</span></div>`).join('');
  document.getElementById('doneExtra').innerHTML='';
  document.getElementById('receiptBox').innerHTML=`
    <div class="rh"><img src="assets/haitibiznis-logo.png" alt=""><div class="bt">HaitiBiznis</div><div class="st">${t('cashier')}</div></div>
    <div class="rrow"><span>${t('order_no')}</span><b>${o.id}</b></div>
    <div class="rrow"><span>${t('date')}</span><span>${fmtDate(o.ts)}</span></div>
    <div class="rrow"><span>${t('customer')}</span><span>${cust}</span></div>
    <div class="rrow"><span>${t('service')}</span><span>${o.svcName}</span></div>
    <div style="height:8px"></div>${items}
    <div class="rtot"><span>${t('total')}</span><span>${gdes(o.amount)}</span></div>
    ${o.payment?`<div class="rrow" style="margin-top:6px"><span>${t('pay_t')}</span><span>${payLabel(o.payment)}</span></div>`:''}
    ${o.docs&&o.docs.length?`<div class="rrow"><span>📎</span><span>${o.docs.length}</span></div>`:''}
    <div class="rf">${t('thanks')}</div>`;
  setupWA(o);go('done');
}
function showTicket(o,ev){const url=qrDataURL(o.ticketCode);
  document.getElementById('doneExtra').innerHTML=`<div class="qrbox">${url?`<img src="${url}" alt="QR">`:''}<div class="qrcode-txt">${o.ticketCode}</div></div>`;
  document.getElementById('receiptBox').innerHTML=`
    <div class="rh"><img src="assets/haitibiznis-logo.png" alt=""><div class="bt">${t('qr_ticket')}</div><div class="st">${ev.name}</div></div>
    <div class="rrow"><span>${t('order_no')}</span><b>${o.id}</b></div>
    <div class="rrow"><span>${t('ev_date')}</span><span>${ev.date||'—'}</span></div>
    <div class="rrow"><span>${t('customer')}</span><span>${o.name}</span></div>
    <div class="rrow"><span>${t('ev_qty')}</span><span>${o.qty}</span></div>
    <div class="rtot"><span>${t('total')}</span><span>${gdes(o.amount)}</span></div>
    <div class="rrow"><span>${t('pay_t')}</span><span>${payLabel(o.payment)}</span></div>
    <div class="rf">${t('thanks')}</div>`;
  setupWA(o);go('done');
}
function showReferral(o){const url=qrDataURL(o.refCode);
  document.getElementById('doneExtra').innerHTML=`<div class="qrbox">${url?`<img src="${url}" alt="QR">`:''}<div class="qrcode-txt">${o.refCode}</div></div>`;
  document.getElementById('receiptBox').innerHTML=`
    <div class="rh"><img src="assets/haitibiznis-logo.png" alt=""><div class="bt">${t('aff_qr')}</div><div class="st">Parenaj Biznis</div></div>
    <div class="rrow"><span>${t('order_no')}</span><b>${o.id}</b></div>
    <div class="rrow"><span>${t('customer')}</span><span>${o.name}</span></div>
    <div class="rrow"><span>${t('qr_ref')}</span><b>${o.refCode}</b></div>
    <div class="rf">${t('thanks')}</div>`;
  setupWA(o);go('done');
}
function setupWA(o){const btn=document.getElementById('waBtn');const num=(o.wa||o.phone||'').replace(/[^0-9]/g,'');
  const msg=t('wa_msg').replace('{name}',o.name).replace('{id}',o.id).replace('{total}',gdes(o.amount));
  btn.onclick=()=>{const base=num?('https://wa.me/'+num):'https://wa.me/';window.open(base+'?text='+encodeURIComponent(msg),'_blank');};}

/* ===================================================================
   ORDERS + SEARCH
   =================================================================== */
let filter='all';
function renderOrders(){const fb=document.getElementById('filterBar');fb.innerHTML='';
  const opts=[{id:'all',lbl:t('all')},{id:'wait',lbl:t('st_wait')},{id:'prog',lbl:t('st_prog')},{id:'ready',lbl:t('st_ready')},{id:'done',lbl:t('st_done')},{id:'reg',lbl:'Enskripsyon'}];
  opts.forEach(o=>{const b=document.createElement('button');b.textContent=o.lbl;b.className=filter===o.id?'on':'';b.onclick=()=>{filter=o.id;renderOrders();};fb.appendChild(b);});
  const q=(document.getElementById('ordSearch').value||'').toLowerCase();
  let orders=load('hb_orders',[]).slice().reverse();
  if(q)orders=orders.filter(o=>(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)||(o.wa||'').includes(q)||o.id.toLowerCase().includes(q));
  if(filter==='reg')orders=orders.filter(o=>o.type==='reg'||o.type==='delivery');
  else if(filter!=='all')orders=orders.filter(o=>o.status===filter);
  const list=document.getElementById('ordersList');list.innerHTML='';
  if(!orders.length){list.innerHTML=`<div class="empty"><div class="ee">📋</div>—</div>`;return;}
  orders.forEach(o=>{const setName=o.statusSet||'sale';const st=sInfo(setName,o.status);
    const el=document.createElement('div');el.className='order';const tag=o.type!=='sale'?`<span class="rtag">${o.type==='reg'?'Enskri':o.type}</span>`:'';
    el.innerHTML=`<div class="top"><div><div class="who">${o.name}${tag}</div><div class="meta">${o.id} · ${o.phone||''} · ${fmtDate(o.ts)}</div></div>
      <span class="badge" style="background:${st.c};color:${st.t}">${st.em} ${t(st.k)}</span></div>
      <div class="svc-t">${o.svcName} ${o.docs&&o.docs.length?('· 📎 '+o.docs.length):''}</div>
      <div class="top"><div class="meta">${o.payment?payLabel(o.payment):''}</div><div class="amt2">${o.amount?gdes(o.amount):''}</div></div>
      <div class="statusrow"></div>`;
    const sr=el.querySelector('.statusrow');STATUS[setName].forEach(s=>{const b=document.createElement('button');b.className=o.status===s.id?'on':'';b.innerHTML=`${s.em}<br>${t(s.k)}`;
      b.onclick=()=>{const os=load('hb_orders',[]);os.find(x=>x.id===o.id).status=s.id;save('hb_orders',os);renderOrders();refreshBadges();};sr.appendChild(b);});
    list.appendChild(el);});
}
document.getElementById('ordSearch').addEventListener('input',renderOrders);

/* ---------- dashboard ---------- */
function renderDash(){const o=load('hb_orders',[]);
  document.getElementById('dashDate').textContent=new Date().toLocaleDateString(lang==='en'?'en-US':'fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const sales=o.filter(x=>x.type==='sale'||x.type==='ticket');
  const salesToday=o.filter(x=>isToday(x.ts)).reduce((a,b)=>a+(+b.amount||0),0);
  const totalRev=o.reduce((a,b)=>a+(+b.amount||0),0);
  const newN=sales.filter(x=>x.status==='wait').length;
  const progN=sales.filter(x=>x.status==='prog').length;
  const doneN=sales.filter(x=>x.status==='done').length;
  document.getElementById('dashStats').innerHTML=`
    <div class="stat sales"><div class="n">${gdes(salesToday)}</div><div class="l">${t('dash_sales')}</div></div>
    <div class="stat"><div class="n" style="color:var(--warn)">${newN}</div><div class="l">🟡 ${t('dash_new')}</div></div>
    <div class="stat"><div class="n" style="color:var(--blue)">${progN}</div><div class="l">🔵 ${t('dash_prog')}</div></div>
    <div class="stat"><div class="n" style="color:var(--good)">${doneN}</div><div class="l">✅ ${t('dash_done')}</div></div>
    <div class="stat rev"><div class="n">${gdes(totalRev)}</div><div class="l">💰 ${t('dash_rev')}</div></div>`;
}

/* ---------- settings ---------- */
function renderSettings(){const cfg=getCfg();const box=document.getElementById('setBody');
  box.innerHTML=`<label class="fl">${t('set_rate')}</label><input type="number" id="set_rate" value="${cfg.rate}">
    <label class="fl">${t('set_regfee_d')}</label><input type="number" id="set_rfd" value="${cfg.regFeeDriver}">
    <label class="fl">${t('set_regfee_r')}</label><input type="number" id="set_rfr" value="${cfg.regFeeRider}">
    <label class="fl">${t('set_regfee_m')}</label><input type="number" id="set_rfm" value="${cfg.regFeeMerchant}">
    <label class="fl">${t('set_regfee_p')}</label><input type="number" id="set_rfp" value="${cfg.regFeePro}">
    <div style="font-weight:800;margin:8px 0 6px">${t('fee_hb')} — ${modById('bizreg').nm}</div>`;
  cfg.bizreg.forEach((r,i)=>{box.innerHTML+=`<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:4px"><div style="font-weight:700;margin-bottom:6px">${r.nm}</div>
    <label class="fl">Base (US$)</label><input type="number" data-usd="${i}" value="${r.usd}">
    <label class="fl">${t('fee_press')} (GDES)</label><input type="number" data-press="${i}" value="${r.press}"></div>`;});
}
function saveSettings(){const cfg=getCfg();cfg.rate=+document.getElementById('set_rate').value||132;
  cfg.regFeeDriver=+document.getElementById('set_rfd').value||0;cfg.regFeeRider=+document.getElementById('set_rfr').value||0;
  cfg.regFeeMerchant=+document.getElementById('set_rfm').value||0;cfg.regFeePro=+document.getElementById('set_rfp').value||0;
  document.querySelectorAll('[data-usd]').forEach(el=>cfg.bizreg[+el.dataset.usd].usd=+el.value||0);
  document.querySelectorAll('[data-press]').forEach(el=>cfg.bizreg[+el.dataset.press].press=+el.value||0);
  setCfg(cfg);const btn=event.target,old=btn.textContent;btn.textContent='✓';setTimeout(()=>btn.textContent=old,900);}

/* ---------- language ---------- */
document.querySelectorAll('.lang button').forEach(b=>{b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('hb_lang',lang);
  document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x===b));applyI18n();renderHome();
  const cur=document.querySelector('.screen.on').id.replace('s-','');if(cur==='orders')renderOrders();if(cur==='dash')renderDash();if(cur==='set')renderSettings();};});

/* ---------- boot ---------- */
document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x.dataset.lang===lang));
applyI18n();renderHome();refreshBadges();
</script>
</body>
</html>
